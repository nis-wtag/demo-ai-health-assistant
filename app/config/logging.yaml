version: 1
disable_existing_loggers: false

formatters:
  detailed:
    format: "%(asctime)s - %(levelname)s - %(module)s:%(filename)s:%(lineno)d - %(message)s"

handlers:
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: detailed
    filename: logs/app.log
    maxBytes: 10485760
    backupCount: 5
    level: INFO

loggers:
  app_logger:
    handlers: [file]
    level: INFO
    propagate: no

root:
  handlers: [file]
  level: INFO
