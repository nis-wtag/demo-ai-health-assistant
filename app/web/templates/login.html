<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Health Assistant - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen font-sans p-4">
    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-xl shadow-lg">
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-3xl font-bold text-slate-800">Welcome Back</h1>
            <p class="mt-2 text-slate-500">Log in to your 🩺 AI Health Assistant account</p>
        </div>

        <!-- Error Message Placeholder -->
        <div id="error-container" class="hidden p-3 bg-red-100 border border-red-200 rounded-lg text-center">
            <p id="error-message" class="text-sm font-medium text-red-700"></p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700">Email Address</label>
                <div class="mt-1">
                    <input type="email" id="email" name="email" required autocomplete="email"
                        class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                <div class="mt-1">
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
            </div>

            <div>
                <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Login
                </button>
            </div>
        </form>

        <!-- Link to Registration -->
        <p class="text-sm text-center text-slate-500">
            Don't have an account?
            <a href="/registration" class="font-medium text-blue-600 hover:underline">
                Register here
            </a>
        </p>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorContainer = document.getElementById('error-container');
        const errorMessageEl = document.getElementById('error-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent normal form submit

            // Hide previous errors
            errorContainer.classList.add('hidden');
            errorMessageEl.textContent = '';

            // Using FormData is a good way to get all form values
            const formData = new FormData(form);

            // Create a simple JavaScript object from the form data for the JSON payload.
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data),
                    credentials: 'include'
                });

                if (response.ok) {
                    // On successful login, redirect to the main chat page
                    window.location.href = '/';
                } else {
                    const resData = await response.json();
                    const detail = resData.detail || 'Login failed. Please check your credentials.';
                    errorMessageEl.textContent = Array.isArray(detail) ? detail[0].msg : detail;
                    errorContainer.classList.remove('hidden');
                }
            } catch (err) {
                errorMessageEl.textContent = 'A network error occurred. Please try again.';
                errorContainer.classList.remove('hidden');
                console.error(err);
            }
        });
    </script>
</body>

</html>
