<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AI Health Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Minimalist scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>

<body class="h-screen flex flex-col font-sans">
    <!-- navigation.html -->
    <nav class="bg-white shadow-md w-full p-4 flex items-center relative">
        <!-- Left: Title -->
        <div class="flex items-center space-x-2 flex-shrink-0">
            <span class="text-2xl font-bold text-slate-700">🩺 AI Health Assistant</span>
        </div>

        <!-- Center: Navigation Icons -->
        <div class="absolute left-1/2 transform -translate-x-1/2 flex items-center space-x-6">
            <!-- Home Icon -->
            <button onclick="window.location.href='/'"
                class="flex flex-col items-center justify-center text-slate-700 hover:text-green-600 transition-colors">
                <img src="/static/icons/home.svg" alt="Home" class="w-6 h-6">
                <span class="text-sm hidden sm:block">Home</span>
            </button>
            <!-- Dashboard Icon -->
            <button onclick="window.location.href='/dashboard'"
                class="flex flex-col items-center justify-center text-slate-700 hover:text-blue-600 transition-colors">
                <img src="/static/icons/dashboard.svg" alt="Dashboard" class="w-6 h-6">
                <span class="text-sm hidden sm:block">Dashboard</span>
            </button>
        </div>

        <!-- Right: User info and logout -->
        <div class="flex items-center space-x-4 ml-auto flex-shrink-0">
            <span class="text-slate-600 font-medium hidden sm:block">Welcome, {{user['full_name']}}!</span>
            <button id="logout-btn"
                class="px-4 py-2 bg-red-500 text-white font-semibold rounded-lg shadow hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-opacity-75 transition-colors">
                Logout
            </button>
        </div>
    </nav>

    <main class="flex-1 flex flex-col p-4 md:p-8 overflow-hidden">
        <div class="max-w-7xl mx-auto w-full flex flex-col h-full">

            <!-- Dashboard Stats -->
            <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
                <div class="bg-white p-6 rounded-xl shadow-lg flex items-center space-x-4">
                    <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                        <!-- Doctor Icon -->
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 20h5v-2a3 3 0 00-5.356-2.37M17 20H7m10 0v-2c0-.653-.084-1.284-.24-1.87M7 20H2v-2a3 3 0 015.356-2.37M7 20v-2c0-.653.084-1.284.24-1.87M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-slate-500">Total Doctors</p>
                        <p id="doctor-count" class="text-3xl font-bold text-slate-800">0</p>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-lg flex items-center space-x-4">
                    <div class="p-3 rounded-full bg-green-100 text-green-600">
                        <!-- Chamber Icon -->
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H2m2 0h5M5 21v-4a2 2 0 012-2h10a2 2 0 012 2v4M5 21V5m0 16H3m2 0h5m0 0v-4m0 4h10m0 0v-4m0 4h2m-2-16H5m14 0v4m0 0h-4m-6 0H7m4 0V5">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-slate-500">Total Chambers</p>
                        <p id="chamber-count" class="text-3xl font-bold text-slate-800">0</p>
                    </div>
                </div>
            </section>

            <!-- Tabs -->
            <div class="flex space-x-4 mb-4">
                <button id="tab-doctors" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Doctors</button>
                <button id="tab-chambers" class="px-4 py-2 bg-gray-200 text-slate-700 rounded-lg">Chambers</button>
            </div>

            <!-- Doctor Table Container -->
            <div id="doctors-table-container" class="flex-1 overflow-hidden">
                <section class="bg-white p-6 rounded-xl mb-4 flex flex-col h-full">
                    <h2 class="text-2xl font-bold text-slate-800 mb-4">Doctor Management</h2>

                    <div class="flex flex-col sm:flex-row justify-between items-center mb-4 space-y-3 sm:space-y-0">
                        <input type="text" id="doctor-search" placeholder="Search doctors..."
                            class="w-full sm:w-72 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button id="add-doctor-btn"
                            class="w-full sm:w-auto px-5 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow hover:bg-blue-700 transition-colors">
                            Add New Doctor
                        </button>
                    </div>

                    <!-- Table -->
                    <div class="flex-1 overflow-auto">
                        <table class="min-w-full w-full table-fixed divide-y divide-slate-200">
                            <thead class="bg-slate-50 sticky top-0 z-10">
                                <tr>
                                    <th
                                        class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">
                                        Name</th>
                                    <th
                                        class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">
                                        Specialty</th>
                                    <th
                                        class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">
                                        Designation</th>
                                    <th
                                        class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">
                                        Actions</th>
                                </tr>
                            </thead>
                            <tbody id="doctor-table-body" class="bg-white divide-y divide-slate-200">
                                <tr>
                                    <td colspan="4" class="px-6 py-4 break-words text-slate-500">Loading doctors...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination (floating) -->
                    <div class="mt-4 flex justify-between items-center px-2 py-1 bg-white">
                        <button id="prev-doctor" class="px-3 py-1 bg-gray-200 rounded">Previous</button>
                        <span id="doctor-page-info" class="text-sm text-slate-600">Page 1</span>
                        <button id="next-doctor" class="px-3 py-1 bg-gray-200 rounded">Next</button>
                    </div>
                </section>
            </div>


            <!-- Chamber Table Container -->
            <div id="chambers-table-container" class="hidden flex-1 overflow-hidden">
                <section class="bg-white p-6 rounded-xl mb-4 flex flex-col h-full">
                    <h2 class="text-2xl font-bold text-slate-800 mb-4">Chamber Management</h2>

                    <div class="flex flex-col sm:flex-row justify-between items-center mb-4 space-y-3 sm:space-y-0">
                        <input type="text" id="chamber-search" placeholder="Search chambers..."
                            class="w-full sm:w-72 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button id="add-chamber-btn"
                            class="w-full sm:w-auto px-5 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow hover:bg-blue-700 transition-colors">
                            Add New Chamber
                        </button>
                    </div>

                    <!-- Table -->
                    <div class="flex-1 overflow-auto">
                        <table class="min-w-full w-full table-fixed divide-y divide-slate-200">
                            <thead class="bg-slate-50 sticky top-0 z-10">
                                <tr>
                                    <th
                                        class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">
                                        Chamber Name
                                    </th>
                                    <th
                                        class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">
                                        Address
                                    </th>
                                    <th
                                        class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">
                                        Actions
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="chamber-table-body" class="bg-white divide-y divide-slate-200">
                                <tr>
                                    <td colspan="3" class="px-6 py-4 break-words text-slate-500">Loading chambers...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination (floating) -->
                    <div class="mt-4 flex justify-between items-center px-2 py-1 bg-white">
                        <button id="prev-chamber" class="px-3 py-1 bg-gray-200 rounded">Previous</button>
                        <span id="chamber-page-info" class="text-sm text-slate-600">Page 1</span>
                        <button id="next-chamber" class="px-3 py-1 bg-gray-200 rounded">Next</button>
                    </div>
                </section>
            </div>


        </div>
    </main>

    <script>
        // --- Element Selectors ---
        const logoutBtn = document.getElementById("logout-btn");
        const doctorCountEl = document.getElementById("doctor-count");
        const chamberCountEl = document.getElementById("chamber-count");
        const doctorTableBody = document.getElementById("doctor-table-body");
        const chamberTableBody = document.getElementById("chamber-table-body");

        // Tabs
        const tabDoctors = document.getElementById("tab-doctors");
        const tabChambers = document.getElementById("tab-chambers");
        const doctorsContainer = document.getElementById("doctors-table-container");
        const chambersContainer = document.getElementById("chambers-table-container");

        // Pagination
        let doctorOffset = 0, doctorLimit = 10;
        let chamberOffset = 0, chamberLimit = 10;

        // --- Event Listeners ---
        logoutBtn.addEventListener("click", handleLogout);
        document.addEventListener("DOMContentLoaded", () => {
            loadDashboardData();
            loadDoctorData();
            loadChamberData();
        });

        tabDoctors.addEventListener("click", () => {
            doctorsContainer.classList.remove("hidden");
            chambersContainer.classList.add("hidden");
            tabDoctors.classList.add("bg-blue-600", "text-white");
            tabDoctors.classList.remove("bg-gray-200", "text-slate-700");
            tabChambers.classList.add("bg-gray-200", "text-slate-700");
            tabChambers.classList.remove("bg-blue-600", "text-white");
        });

        tabChambers.addEventListener("click", () => {
            chambersContainer.classList.remove("hidden");
            doctorsContainer.classList.add("hidden");
            tabChambers.classList.add("bg-blue-600", "text-white");
            tabChambers.classList.remove("bg-gray-200", "text-slate-700");
            tabDoctors.classList.add("bg-gray-200", "text-slate-700");
            tabDoctors.classList.remove("bg-blue-600", "text-white");
        });

        document.getElementById("prev-doctor").addEventListener("click", () => {
            if (doctorOffset >= doctorLimit) { doctorOffset -= doctorLimit; loadDoctorData(); }
        });
        document.getElementById("next-doctor").addEventListener("click", () => {
            doctorOffset += doctorLimit; loadDoctorData();
        });
        document.getElementById("prev-chamber").addEventListener("click", () => {
            if (chamberOffset >= chamberLimit) { chamberOffset -= chamberLimit; loadChamberData(); }
        });
        document.getElementById("next-chamber").addEventListener("click", () => {
            chamberOffset += chamberLimit; loadChamberData();
        });

        // --- Functions ---
        async function handleLogout() {
            try {
                await fetch("/api/v1/auth/logout", { method: "POST", credentials: "include" });
                window.location.href = "/login";
            } catch (err) { console.error("Logout failed:", err); }
        }

        async function loadDashboardData() {
            try {
                const response = await fetch("/api/v1/dashboard/stats");
                if (!response.ok) throw new Error('Failed to fetch stats');
                const stats = await response.json();
                doctorCountEl.textContent = stats.doctor_count;
                chamberCountEl.textContent = stats.chamber_count;
            } catch (err) {
                console.error(err);
            }
        }

        async function loadDoctorData() {
            try {
                const response = await fetch(`/api/v1/doctors?offset=${doctorOffset}&limit=${doctorLimit}`);
                if (!response.ok) throw new Error('Failed to fetch doctors');
                const doctors = await response.json();
                renderDoctorTable(doctors);
                document.getElementById("doctor-page-info").textContent = `Showing ${doctorOffset + 1} to ${doctorOffset + doctors.length}`;
            } catch (err) {
                console.error(err);
                doctorTableBody.innerHTML = `<tr><td colspan="4" class="text-red-500 p-4">${err.message}</td></tr>`;
            }
        }

        async function loadChamberData() {
            try {
                const response = await fetch(`/api/v1/chambers?offset=${chamberOffset}&limit=${chamberLimit}`);
                if (!response.ok) throw new Error('Failed to fetch chambers');
                const chambers = await response.json();
                renderChamberTable(chambers);
                document.getElementById("chamber-page-info").textContent = `Showing ${chamberOffset + 1} to ${chamberOffset + chambers.length}`;
            } catch (err) {
                console.error(err);
                chamberTableBody.innerHTML = `<tr><td colspan="3" class="text-red-500 p-4">${err.message}</td></tr>`;
            }
        }

        function renderDoctorTable(doctors) {
            doctorTableBody.innerHTML = "";
            if (doctors.length === 0) {
                doctorTableBody.innerHTML = `<tr><td colspan="4" class="text-slate-500 p-4 text-center">No doctors found.</td></tr>`;
                return;
            }
            doctors.forEach(doctor => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="px-6 py-4 break-words">
                        <div class="text-sm font-medium text-slate-900">${doctor.full_name}</div>
                        <div class="text-sm text-slate-500">${doctor.degrees.join(', ')}</div>
                    </td>
                    <td class="px-6 py-4 break-words text-sm text-slate-600">${doctor.specialization}</td>
                    <td class="px-6 py-4 break-words text-sm text-slate-600">${doctor.designation}</td>
                    <td class="px-6 py-4 break-words text-right text-sm font-medium space-x-2">
                        <button class="text-yellow-600 hover:text-yellow-900" onclick="editDoctor(${doctor.id})">Edit</button>
                        <button class="text-red-600 hover:text-red-900" onclick="deleteDoctor(${doctor.id})">Delete</button>
                    </td>
                `;
                doctorTableBody.appendChild(tr);
            });
        }

        function renderChamberTable(chambers) {
            chamberTableBody.innerHTML = "";
            if (chambers.length === 0) {
                chamberTableBody.innerHTML = `<tr><td colspan="3" class="text-slate-500 p-4 text-center">No chambers found.</td></tr>`;
                return;
            }
            chambers.forEach(chamber => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="px-6 py-4 break-words text-sm font-medium text-slate-900">${chamber.chamber_name}</td>
                    <td class="px-6 py-4 break-words text-sm text-slate-600">${chamber.address}</td>
                    <td class="px-6 py-4 break-words text-right text-sm font-medium space-x-2">
                        <button class="text-yellow-600 hover:text-yellow-900" onclick="editChamber(${chamber.id})">Edit</button>
                        <button class="text-red-600 hover:text-red-900" onclick="deleteChamber(${chamber.id})">Delete</button>
                    </td>
                `;
                chamberTableBody.appendChild(tr);
            });
        }

        // --- Placeholder CRUD ---
        function editDoctor(id) { alert(`TODO: Edit Doctor ID: ${id}`); }
        function deleteDoctor(id) { if (confirm(`Delete Doctor ID: ${id}?`)) { alert(`TODO: Delete Doctor ID: ${id}`); } }
        function editChamber(id) { alert(`TODO: Edit Chamber ID: ${id}`); }
        function deleteChamber(id) { if (confirm(`Delete Chamber ID: ${id}?`)) { alert(`TODO: Delete Chamber ID: ${id}`); } }

    </script>
</body>

</html>
