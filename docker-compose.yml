services:
  app:
    image: aha_app:dev
    pull_policy: never
    container_name: aha_app
    build:
      context: ./app
      dockerfile: Dockerfile
      target: runner
    volumes:
      - ./app:/app
    networks:
      - aha_network
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: aha_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - aha_network
    ports:
      - "5433:5432"
    env_file:
      - .env.docker
    environment:
      - CHOKIDAR_USEPOLLING=true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  aha_network:
    driver: bridge

volumes:
  postgres_data:
